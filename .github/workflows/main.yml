name: Build GKI Kernel with Lindroid DRM, (berhasil)

on:
  workflow_dispatch:

jobs:
  build-gki:
    runs-on: ubuntu-latest
    env:
      DEVICE: pantah
      KERNEL_REPO: RONNIE158/android_kernel_google_gs201
      KERNEL_BRANCH: 13.0.0-sultan
      PATCH_REPO: Linux-on-droid/lindroid-drm-loopback
      CLANG_VERSION: r416183b
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
    - name: Checkout Kernel
      uses: actions/checkout@v3
      with:
        repository: ${{ env.KERNEL_REPO }}
        ref: ${{ env.KERNEL_BRANCH }}
        path: kernel
  
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bc bison build-essential flex lld \
          libssl-dev libncurses5-dev libncursesw5-dev \
          python3 python3-pip rsync ccache zip \
          binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi \
          git curl wget unzip \
          libelf-dev dwarves \
          coreutils device-tree-compiler \
          clang llvm \
          lz4 xz-utils zstd \
          android-sdk-libsparse-utils

    - name: Download toolchain
      run: |
        AOSP_MIRROR=https://android.googlesource.com
        BRANCH=main-kernel-build-2024
        git clone $AOSP_MIRROR/kernel/prebuilts/build-tools -b $BRANCH --depth 1 kernel-build-tools
        git clone $AOSP_MIRROR/platform/system/tools/mkbootimg -b $BRANCH --depth 1 mkbootimg

    - name: Set environment variables
      run: |
        echo "AVBTOOL=$GITHUB_WORKSPACE/kernel-build-tools/linux-x86/bin/avbtool" >> $GITHUB_ENV
        echo "MKBOOTIMG=$GITHUB_WORKSPACE/mkbootimg/mkbootimg.py" >> $GITHUB_ENV
        echo "UNPACK_BOOTIMG=$GITHUB_WORKSPACE/mkbootimg/unpack_bootimg.py" >> $GITHUB_ENV  

    #- name: Set up LineageOS Clang 14
      #run: |
        #git clone --depth=1 https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b clang
        #echo "${{ github.workspace }}/clang/bin" >> $GITHUB_PATH

    #- name: Set up LineageOS GCC Toolchains
      #run: |
        #git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 gcc64
        #git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 gcc32
        #echo "${{ github.workspace }}/gcc64/bin" >> $GITHUB_PATH
        #echo "${{ github.workspace }}/gcc32/bin" >> $GITHUB_PATH

    - name: Ensure Clang is used
      run: |
        which clang
        clang --version   


    - name: Checkout Lindroid DRM Loopback
      uses: actions/checkout@v3
      with:
        repository: ${{ env.PATCH_REPO }}
        path: drm-dkms

    - name: Patch Kernel for Lindroid DRM
      run: |
        cd kernel
        # Pastikan tree bersih dulu
        make ARCH=arm64 mrproper || true
        rm -rf out

        # Tambah ke drivers/Makefile
        echo 'obj-y += lindroid-drm/' >> drivers/Makefile
        # Tambah ke drivers/Kconfig
        echo 'source "drivers/lindroid-drm/Kconfig"' >> drivers/Kconfig

        # Copy source lindroid-drm ke tree kernel
        cp -r ../drm-dkms drivers/lindroid-drm

    - name: Build Kernel GKI 5.10
      run: |
       cd kernel
        make ARCH=arm64 mrproper || true
        rm -rf out
        mkdir out
        make O=out ARCH=arm64 gki_defconfig
       # Fix configs
       scripts/config --file out/.config --disable IKHEADERS
       scripts/config --file out/.config --disable IKHEADERS_PROC
       scripts/config --file out/.config --disable KALLSYMS
       scripts/config --file out/.config --disable KALLSYMS_ALL
       # Enable LXC support
       scripts/config --file out/.config -e NAMESPACES
       scripts/config --file out/.config -e UTS_NS
       scripts/config --file out/.config -e IPC_NS
       scripts/config --file out/.config -e USER_NS
       scripts/config --file out/.config -e PID_NS
       scripts/config --file out/.config -e NET_NS

       scripts/config --file out/.config -e CGROUPS
       scripts/config --file out/.config -e CGROUP_SCHED
       scripts/config --file out/.config -e CGROUP_FREEZER
       scripts/config --file out/.config -e CGROUP_DEVICE
       scripts/config --file out/.config -e CPUSETS
       scripts/config --file out/.config -e CGROUP_CPUACCT
       scripts/config --file out/.config -e MEMCG
       scripts/config --file out/.config -e MEMCG_SWAP
       scripts/config --file out/.config -e CGROUP_PERF
       scripts/config --file out/.config -e CGROUP_PIDS
       scripts/config --file out/.config -e CGROUP_BPF

       scripts/config --file out/.config -e KEYS
       scripts/config --file out/.config -e SECCOMP
       scripts/config --file out/.config -e SECCOMP_FILTER
       scripts/config --file out/.config -e SECURITY
       scripts/config --file out/.config -e SECURITYFS

       scripts/config --file out/.config -e PROC_FS
       scripts/config --file out/.config -e SYSFS
       scripts/config --file out/.config -e TMPFS
       scripts/config --file out/.config -e TMPFS_POSIX_ACL
       scripts/config --file out/.config -e DEVPTS_MULTIPLE_INSTANCES
       scripts/config --file out/.config -e OVERLAY_FS

       scripts/config --file out/.config -e VETH
       scripts/config --file out/.config -e BRIDGE
       scripts/config --file out/.config -e NETFILTER
       scripts/config --file out/.config -e NF_NAT
       scripts/config --file out/.config -e IP_NF_IPTABLES
       scripts/config --file out/.config -e IP_NF_TARGET_MASQUERADE

       # Apply config changes
       yes "" | make O=out ARCH=arm64 olddefconfig

       # Make modules_prepare
       make O=out ARCH=arm64 modules_prepare

       # Build with verbose logging
       PATH=${{ github.workspace }}/clang/bin:${{ github.workspace }}/gcc64/bin:${{ github.workspace }}/gcc32/bin:/usr/bin
       make O=out ARCH=arm64 \
       CC=clang \
       CXX=clang++ \
       LD=ld.lld \
       LLVM=1 \
       LLVM_IAS=1 \
       CROSS_COMPILE=aarch64-linux-android- \
       CROSS_COMPILE_ARM32=arm-linux-androideabi- \
       Image.lz4 dtbs modules | tee build.log
    

    - name: Verify Lindroid DRM Build
      run: |
        cd kernel
        if grep -q "AR      drivers/lindroid-drm/built-in.a" build.log; then
          echo "✅ Lindroid DRM built successfully"
        else
          echo "❌ Lindroid DRM NOT built"
          exit 1
        fi    

    - name: Collect Build Outputs
      run: |
        mkdir -p artifacts
        cp kernel/out/arch/arm64/boot/Image.lz4 artifacts/
        cp kernel/out/arch/arm64/boot/dts/google/*.dtb artifacts/ || true
        cp kernel/out/arch/arm64/boot/dts/google/*.dtbo artifacts/ || true
        find kernel/out -name "*.ko" -exec cp {} artifacts/ \;

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: gki-lindroid-build
        path: artifacts
