name: Build Kernel from Kernel Tree

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DEFCONFIG: gs201_defconfig  # ganti sesuai defconfig device kamu
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v3

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y git wget unzip zip curl bc build-essential flex bison \
          libssl-dev ccache python3
      
      - name : cekout libcurses
        run : |
          wget http://archive.ubuntu.com/ubuntu/pool/main/n/ncurses/libncurses6-dev_6.4-0ubuntu1_amd64.deb
          sudo dpkg -i libncurses6-dev_6.4-0ubuntu1_amd64.deb
          sudo apt-get install -f

      - name: Make build.sh executable
        run: chmod +x kernel/build.sh

      - name: Build Kernel
        working-directory: ./kernel  # workflow akan langsung jalan di folder kernel
        run: ./build.sh
