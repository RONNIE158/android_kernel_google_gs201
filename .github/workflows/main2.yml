name: Build GKI Kernel with Lindroid DRM (Google Clang)

on:
  workflow_dispatch:

jobs:
  build-gki:
    runs-on: ubuntu-latest
    env:
      DEVICE: pantah
      KERNEL_REPO: RONNIE158/android_kernel_google_gs201
      KERNEL_BRANCH: 13.0.0-sultan
      PATCH_REPO: Linux-on-droid/lindroid-drm-loopback
      DEFCONFIG: gs201_defconfig
      TC_DIR: ${{ github.workspace }}/clang-r547379
      PATH: ${{ github.workspace }}/clang-r547379/bin:/usr/bin
      CC: clang
      CXX: clang++
      LD: ld.lld
      LLVM: 1
      LLVM_IAS: 1
      CROSS_COMPILE: aarch64-linux-gnu-
      CROSS_COMPILE_ARM32: arm-linux-gnueabi-
      KCFLAGS: "-Wno-error=ignored-optimization-argument"
      KBUILD_IGNORE_MISSING_SYSCALLS: 1

    steps:
    - name: Checkout Kernel
      uses: actions/checkout@v3
      with:
        repository: ${{ env.KERNEL_REPO }}
        ref: ${{ env.KERNEL_BRANCH }}
        path: kernel

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bc bison build-essential flex lld \
          libssl-dev libncurses5-dev libncursesw5-dev \
          python3 python3-pip rsync ccache zip \
          binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi \
          git curl wget unzip libelf-dev dwarves \
          coreutils device-tree-compiler clang llvm lz4 xz-utils zstd

    - name: Download Google Clang r547379
      run: |
        mkdir -p ${{ env.TC_DIR }}
        wget -P ${{ env.TC_DIR }}/ https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r547379.tar.gz
        tar -xf ${{ env.TC_DIR }}/clang-r547379.tar.gz -C ${{ env.TC_DIR }}/
        rm -f ${{ env.TC_DIR }}/clang-r547379.tar.gz

    - name: Checkout Lindroid DRM
      uses: actions/checkout@v3
      with:
        repository: ${{ env.PATCH_REPO }}
        path: drm-dkms

    - name: Patch Kernel for Lindroid DRM
      run: |
        cd kernel
        echo 'obj-y += lindroid-drm/' >> drivers/Makefile
        echo 'source "drivers/lindroid-drm/Kconfig"' >> drivers/Kconfig
        cp -r ../drm-dkms drivers/lindroid-drm

    - name: Build Kernel GKI 5.10
      run: |
        cd kernel
        rm -rf out && mkdir -p out
        make O=out ARCH=arm64 ${{ env.DEFCONFIG }}
        # Apply LXC & CGROUP support if needed
        scripts/config --file out/.config -e CGROUPS CPUSETS MEMCG CGROUP_CPUACCT
        make O=out ARCH=arm64 olddefconfig
        make -j$(nproc) O=out ARCH=arm64 \
          CC=clang LD=ld.lld AR=llvm-ar AS=llvm-as NM=llvm-nm \
          OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
          CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
          LLVM=1 LLVM_IAS=1 LTO=full \
          KCFLAGS="-Wno-error=ignored-optimization-argument" \
          KBUILD_IGNORE_MISSING_SYSCALLS=1 | tee build.log

    - name: AnyKernel Setup
      run: |
        if [ ! -d ../anykernel ]; then
          git clone https://github.com/sudoyottaxbyte/any_kernel.git ../anykernel
        fi

    - name: Zip Kernel
      run: |
        if [[ -f out/arch/arm64/boot/Image.lz4 ]] && [[ -f out/arch/arm64/boot/dts/google/dtbo.img ]]; then
          cp out/arch/arm64/boot/Image.lz4 ../anykernel/
          cp out/arch/arm64/boot/dts/google/dtbo.img ../anykernel/
          cd ../anykernel && zip -r9 Kernel-A13-GoPix-7-Series-KSu-next.zip *
        else
          echo "❌ Build failed, Image.lz4 or dtbo.img missing"
          exit 1
        fi
